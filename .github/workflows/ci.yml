name: Java CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs: 
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: ./FASTSHOP/net
        run: chmod +x mvnw
        
      - name: Build and test
        working-directory: ./FASTSHOP/net
        run: ./mvnw --batch-mode clean verify

    