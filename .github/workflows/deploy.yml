name: Java CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiTest_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: ./FASTSHOP/net
        run: chmod +x mvnw

      - name: Build and test
        working-directory: ./FASTSHOP/net
        shell: bash
        run: |
          set -a
          source .env.ci
          set +a
          ./mvnw --batch-mode clean verify

  deploy:
    name: Build and Deploy
    needs: build-and-test
    # Chỉ deploy khi push vào main (pull request và nhánh dev thì chỉ chạy test)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest  

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/TranDucVietAnh-compose-app/san_thuong_mai_devops_course/FASTSHOP/net
            # cập nhật docker-compose.yml và các file cấu hình trên server theo main
            git pull --ff-only origin main
            # build image app từ Dockerfile ngay trên server rồi chạy lại app
            docker compose up -d --build --no-deps app
            docker image prune -f
            echo "--- docker compose ps ---"
            docker compose ps
            echo "--- health check ---"
            curl -fsS --retry 20 --retry-delay 5 --retry-all-errors http://localhost:18096/
